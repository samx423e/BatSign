name: Build BatSign IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Compile & package (unsigned)
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain sanity
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache OpenSSL (device + simulator)
        uses: actions/cache@v4
        with:
          path: Vendor/openssl
          key: openssl-all-${{ runner.os }}-${{ hashFiles('scripts/build-openssl.sh') }}

      - name: Build OpenSSL (device + simulator)
        run: |
          ./scripts/build-openssl.sh iphoneos
          ./scripts/build-openssl.sh iphonesimulator

      - name: Cache zstd (device + simulator)
        uses: actions/cache@v4
        with:
          path: Vendor/zstd
          key: zstd-all-${{ runner.os }}-${{ hashFiles('scripts/build-zstd.sh') }}

      - name: Build zstd (device + simulator)
        run: |
          ./scripts/build-zstd.sh iphoneos
          ./scripts/build-zstd.sh iphonesimulator

      - name: Generate app icon
        run: swift scripts/make-icon.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Unit tests (iOS simulator)
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); names=[dev['name'] for runtime, devs in d['devices'].items() for dev in devs if dev.get('isAvailable') and dev['name'].startswith('iPhone')]; print(names[0])")
          echo "Simulator: $SIM"
          xcodebuild test -project BatSign.xcodeproj \
            -scheme BatSign \
            -destination "platform=iOS Simulator,name=$SIM,OS=latest" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | tail -25

      - name: Collect crash reports (always)
        if: always()
        run: |
          mkdir -p crashreports
          cp -R ~/Library/Logs/DiagnosticReports/. crashreports/ 2>/dev/null || true
          XCR=$(find ~/Library/Developer/Xcode/DerivedData -name "*.xcresult" -path "*Logs/Test*" | head -1)
          if [ -n "$XCR" ]; then
            xcrun xcresulttool get test-results summary --path "$XCR" > crashreports/test-summary.json 2>/dev/null || true
          fi
          ls -la crashreports | head -20

      - name: Upload test log + crashes (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: |
            test.log
            crashreports/
          if-no-files-found: ignore

      - name: Compile app (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild -project BatSign.xcodeproj \
            -scheme BatSign \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPRESS_INT_RESOURCES=YES \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: ./scripts/make-ipa.sh

      - name: Verify IPA structure
        run: |
          unzip -l BatSign.ipa | head -20
          test -d "$(mktemp -d)/empty" || true
          STAGE=$(mktemp -d)
          unzip -q BatSign.ipa -d "$STAGE"
          APP=$(find "$STAGE/Payload" -maxdepth 1 -name '*.app' | head -n1)
          test -n "$APP"
          test -f "$APP/BatSign"
          file "$APP/BatSign"
          test -f "$APP/Info.plist"
          echo "IPA structure OK"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatSign-unsigned-ipa
          path: BatSign.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BatSign.ipa
